<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12" />
  <!-- Wallet Back Flap -->
  <rect x="80" y="70" width="240" height="145" rx="14" fill="#451a03" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6,4" />
  <!-- Wallet Main Body -->
  <rect x="80" y="85" width="240" height="130" rx="12" fill="url(#leatherGrad)" stroke="#d97706" stroke-width="2" />
  <!-- Card Slots Sticking Out -->
  <rect x="110" y="55" width="70" height="35" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="118" y="62" width="25" height="15" rx="2" fill="#fbbf24" />
  <rect x="190" y="60" width="85" height="30" rx="4" fill="#059669" stroke="#34d399" stroke-width="1.5" />
  <!-- Leather Texture Fold Line -->
  <line x1="200" y1="85" x2="200" y2="215" stroke="#451a03" stroke-width="4" stroke-dasharray="4,2" />
  <!-- Metal Clasp / Logo -->
  <rect x="290" y="135" width="35" height="30" rx="6" fill="#f59e0b" stroke="#fef3c7" stroke-width="1.5" />
  <circle cx="307" cy="150" r="4" fill="#78350f" />
  <!-- Badge -->
  <rect x="290" y="16" width="95" height="22" rx="11" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="1" />
  <text x="337" y="31" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WALLETS</text>
</svg>
