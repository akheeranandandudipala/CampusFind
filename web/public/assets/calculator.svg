<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12" />
  <!-- Calculator Body -->
  <rect x="130" y="30" width="140" height="220" rx="14" fill="url(#calcGrad)" stroke="#475569" stroke-width="2.5" />
  <!-- Solar Panel -->
  <rect x="145" y="45" width="40" height="15" rx="2" fill="#713f12" stroke="#a16207" />
  <line x1="158" y1="45" x2="158" y2="60" stroke="#a16207" />
  <line x1="172" y1="45" x2="172" y2="60" stroke="#a16207" />
  <!-- Logo -->
  <text x="235" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">CASIO</text>
  <!-- LCD Screen -->
  <rect x="145" y="68" width="110" height="42" rx="4" fill="#a3e635" stroke="#4d7c0f" stroke-width="1.5" />
  <text x="152" y="85" fill="#14532d" font-family="monospace" font-size="9">f(x)=2x²+3x+1</text>
  <text x="245" y="103" fill="#14532d" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">42.000</text>
  <!-- Navigation Pad -->
  <circle cx="200" cy="126" r="12" fill="#475569" stroke="#64748b" />
  <circle cx="200" cy="126" r="5" fill="#1e293b" />
  <!-- Numeric / Function Key Grid -->
  <g fill="#475569" rx="3">
    <!-- Row 1 -->
    <rect x="145" y="146" width="18" height="14" rx="3" fill="#64748b" />
    <rect x="168" y="146" width="18" height="14" rx="3" fill="#64748b" />
    <rect x="191" y="146" width="18" height="14" rx="3" fill="#64748b" />
    <rect x="214" y="146" width="18" height="14" rx="3" fill="#0284c7" />
    <rect x="237" y="146" width="18" height="14" rx="3" fill="#ef4444" />
    <!-- Row 2 -->
    <rect x="145" y="166" width="18" height="14" rx="3" />
    <rect x="168" y="166" width="18" height="14" rx="3" />
    <rect x="191" y="166" width="18" height="14" rx="3" />
    <rect x="214" y="166" width="18" height="14" rx="3" />
    <rect x="237" y="166" width="18" height="14" rx="3" />
    <!-- Row 3 -->
    <rect x="145" y="186" width="18" height="14" rx="3" />
    <rect x="168" y="186" width="18" height="14" rx="3" />
    <rect x="191" y="186" width="18" height="14" rx="3" />
    <rect x="214" y="186" width="18" height="14" rx="3" />
    <rect x="237" y="186" width="18" height="14" rx="3" />
    <!-- Row 4 -->
    <rect x="145" y="206" width="18" height="14" rx="3" />
    <rect x="168" y="206" width="18" height="14" rx="3" />
    <rect x="191" y="206" width="18" height="14" rx="3" />
    <rect x="214" y="206" width="41" height="14" rx="3" fill="#38bdf8" />
  </g>
  <!-- Badge -->
  <rect x="290" y="16" width="95" height="22" rx="11" fill="rgba(14,165,233,0.15)" stroke="#0ea5e9" stroke-width="1" />
  <text x="337" y="31" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ELECTRONICS</text>
</svg>
