<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12" />
  <!-- Laptop Screen -->
  <rect x="70" y="45" width="260" height="150" rx="8" fill="#334155" stroke="#475569" stroke-width="2" />
  <rect x="80" y="55" width="240" height="130" rx="4" fill="url(#screenGrad)" />
  <!-- Screen Glow / UI Elements -->
  <circle cx="200" cy="115" r="24" fill="#38bdf8" opacity="0.3" />
  <path d="M190 115 L210 115 M200 105 L200 125" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <rect x="100" y="70" width="80" height="6" rx="3" fill="#ffffff" opacity="0.6" />
  <rect x="100" y="82" width="50" height="4" rx="2" fill="#ffffff" opacity="0.4" />
  <!-- Web Camera -->
  <circle cx="200" cy="50" r="2.5" fill="#64748b" />
  <!-- Laptop Base -->
  <path d="M40 198 L360 198 L345 220 L55 220 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <!-- Trackpad Notch -->
  <rect x="175" y="198" width="50" height="5" rx="2" fill="#475569" />
  <rect x="160" y="206" width="80" height="10" rx="2" fill="#334155" />
  <!-- Badge -->
  <rect x="290" y="16" width="95" height="22" rx="11" fill="rgba(14,165,233,0.15)" stroke="#0ea5e9" stroke-width="1" />
  <text x="337" y="31" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ELECTRONICS</text>
</svg>
