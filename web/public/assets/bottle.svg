<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanBottle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bgGrad)" rx="12" />
  <!-- Bottle Cap & Handle -->
  <rect x="175" y="35" width="50" height="25" rx="5" fill="#334155" stroke="#64748b" stroke-width="2" />
  <path d="M190 35 C190 20 210 20 210 35" fill="none" stroke="#64748b" stroke-width="4" />
  <rect x="180" y="60" width="40" height="15" fill="#475569" />
  <!-- Bottle Body -->
  <path d="M165 85 C165 75 180 75 180 75 L220 75 C220 75 235 75 235 85 L235 220 C235 230 225 235 215 235 L185 235 C175 235 165 230 165 220 Z" fill="url(#cyanBottle)" stroke="#22d3ee" stroke-width="2" />
  <!-- Steel Rim / Accent Lines -->
  <line x1="166" y1="120" x2="234" y2="120" stroke="#a5f3fc" stroke-width="1.5" opacity="0.6" />
  <line x1="166" y1="180" x2="234" y2="180" stroke="#a5f3fc" stroke-width="1.5" opacity="0.6" />
  <text x="200" y="155" fill="#e0f2fe" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">MILTON</text>
  <!-- Specular Highlight -->
  <path d="M175 90 L175 215" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  <!-- Badge -->
  <rect x="290" y="16" width="95" height="22" rx="11" fill="rgba(6,182,212,0.15)" stroke="#06b6d4" stroke-width="1" />
  <text x="337" y="31" fill="#22d3ee" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BOTTLES</text>
</svg>
